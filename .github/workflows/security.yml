name: security

# Dependency gates on every pull request (and on master, so a newly published
# advisory shows up there too): known-vulnerable Go code paths, npm advisories
# in the UI's production dependencies, and the dependency changes a pull
# request introduces.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck (reachable vulnerabilities only)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  npm-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: npm audit (shipped dependencies, high and above)
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
