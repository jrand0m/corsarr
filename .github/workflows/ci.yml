name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI — install, check, test, build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test
          npm run build
      - name: Go — format and vet
        run: |
          test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
          go vet ./...
      - name: Go — tests (race detector)
        run: go test -race -timeout 900s ./...
      - name: Complexity gate (CRAP < 10)
        run: scripts/quality.sh
      - name: Size and idle-memory budget
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/corsarr-linux-amd64 ./cmd/corsarr
          scripts/budget.sh bin/corsarr-linux-amd64

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and vet ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/corsarr

  container:
    # Runs the image as restricted platforms do: the image user, a random uid
    # with gid 0, a read-only root file system with tmpfs /tmp, and rootless Podman.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          for i in 1 2 3; do docker build --build-arg VERSION=ci -t corsarr:container-test . && break; sleep $((i*15)); done
          docker image inspect corsarr:container-test >/dev/null
      - name: Docker — uid 65532, random uid + gid 0, read-only root, refusals
        run: scripts/container-test.sh corsarr:container-test docker
      - name: Rootless Podman
        run: |
          if ! command -v podman >/dev/null; then echo "podman is not installed on this runner; skipping"; exit 0; fi
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          docker save corsarr:container-test | podman load
          scripts/container-test.sh corsarr:container-test podman
