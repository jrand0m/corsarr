name: release

# A version tag (v1.2.3) on master builds the release twice, on an amd64 and an
# arm64 runner, inside the pinned builder (Dockerfile + scripts/release.sh).
# The release fails unless both builds are byte-for-byte identical. Then the
# first build is published: six archives and six Linux packages (.deb, .rpm,
# .apk), the plugin modules (<id>-<version>.wasm) with plugins-index.json, all
# in SHA256SUMS, an SBOM and a build-provenance attestation per file, and
# the multi-arch image with a keyless cosign signature, provenance and SBOM
# attestations (release tags also move :latest and :stable and publish the Helm
# chart to ghcr.io/<owner>/charts). The plugin index is signed with the Ed25519
# key in the PLUGIN_INDEX_SIGNING_KEY secret, which only the publish job reads
# (without it the index is published unsigned and corsarr refuses it). Build
# jobs have no secrets and read-only access; publishing uses short-lived OIDC
# credentials. VERIFYING.md explains how to check any of it.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must point at a commit on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag and its commit time are build inputs
          persist-credentials: false
      - name: Build archives and image in the pinned builder
        env:
          NO_CACHE: all
        run: scripts/release.sh build "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.runner }}
          path: ${{ runner.temp }}/build
          retention-days: 3

  compare:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.modules.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: builds
      - name: Both builds must be identical
        run: |
          set -euo pipefail
          diff builds/build-ubuntu-24.04/build.env builds/build-ubuntu-24.04-arm/build.env
          go run ./scripts/repro compare builds/build-ubuntu-24.04 builds/build-ubuntu-24.04-arm
      - id: modules
        name: Plugin modules to attest
        run: |
          set -euo pipefail
          cd builds/build-ubuntu-24.04/archives
          list=$(for f in ./*.wasm; do [ -f "$f" ] && basename "$f"; done | jq -R . | jq -cs .)
          [ "$list" != "[]" ] || { echo "no plugin modules in the build"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

  image:
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: build
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push the verified image without rebuilding it
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest=$(sed -n 's/^IMAGE_DIGEST=//p' build/build.env)
          tags=("$GITHUB_REF_NAME")
          # release tags (no "-rc.N" suffix) are stable; prereleases only get their own tag
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(latest stable)
          for t in "${tags[@]}"; do
            for i in 1 2 3; do
              skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
                oci:build/image "docker://$repo:$t" && break
              sleep $((i * 10))
            done
          done
          pushed="sha256:$(skopeo inspect --raw --authfile "$HOME/.docker/config.json" "docker://$repo:$GITHUB_REF_NAME" | sha256sum | cut -d' ' -f1)"
          [ "$pushed" = "$digest" ] || { echo "registry digest $pushed differs from the built $digest"; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Keyless signature
        run: cosign sign --yes "${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        id: syft
      - name: SBOM per platform
        run: |
          set -euo pipefail
          for p in amd64 arm64; do
            "${{ steps.syft.outputs.cmd }}" scan "registry:${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}" \
              --platform "linux/$p" -o "spdx-json=corsarr-image-linux-$p.spdx.json"
          done
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: corsarr-image-linux-amd64.spdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: corsarr-image-linux-arm64.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: corsarr-image-*.spdx.json
          retention-days: 3

  files:
    # One SBOM per archive and package (the Go modules inside its binary), attested
    # together with build provenance.
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        id: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64,
             deb-amd64, deb-arm64, rpm-amd64, rpm-arm64, apk-amd64, apk-arm64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: build
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        id: syft
      - name: SBOM for ${{ matrix.id }}
        env:
          ID: ${{ matrix.id }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          cd build/archives
          kind="${ID%-*}" arch="${ID#*-}"
          rarch=x86_64; [ "$arch" = arm64 ] && rarch=aarch64
          case "$kind" in
            windows) file="corsarr-$ID.zip" ;;
            linux|darwin) file="corsarr-$ID.tar.gz" ;;
            deb) file=$(ls corsarr_*_"$arch".deb) ;;
            rpm) file=$(ls corsarr-*."$rarch".rpm) ;;
            apk) file=$(ls corsarr_*_"$rarch".apk) ;;
          esac
          # a package carries the linux binary of its architecture
          src="corsarr-$ID"; case "$kind" in deb|rpm|apk) src="corsarr-linux-$arch" ;; esac
          mkdir -p ../x
          case "$src" in
            corsarr-windows-*) unzip -q "$src.zip" -d ../x ;;
            *) tar -xzf "$src.tar.gz" -C ../x ;;
          esac
          "$SYFT" scan "dir:../x/$src" --source-name corsarr --source-version "$GITHUB_REF_NAME" \
            -o "spdx-json=../$file.spdx.json"
          echo "FILE=build/archives/$file" >> "$GITHUB_ENV"
          echo "SBOM=build/$file.spdx.json" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.FILE }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.FILE }}
          sbom-path: ${{ env.SBOM }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.id }}
          path: ${{ env.SBOM }}
          retention-days: 3

  plugins:
    # One SBOM per plugin module (read from the build information embedded in
    # it), attested together with build provenance.
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        module: ${{ fromJSON(needs.compare.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: build
      - name: SBOM for ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          epoch=$(sed -n 's/^SOURCE_DATE_EPOCH=//p' build/build.env)
          go run ./scripts/pluginindex sbom -epoch "$epoch" -o "build/$MODULE.spdx.json" \
            -namespace "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$MODULE.spdx.json" \
            "build/archives/$MODULE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/archives/${{ matrix.module }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: build/archives/${{ matrix.module }}
          sbom-path: build/${{ matrix.module }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-plugin-${{ matrix.module }}
          path: build/${{ matrix.module }}.spdx.json
          retention-days: 3

  chart:
    # The Helm chart as an OCI artifact, for releases only (no -rc.N); its version
    # and appVersion are the release's.
    needs: image
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: push
        name: Package and push the chart to ghcr.io/<owner>/charts/corsarr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/corsarr --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME" --destination chart
          out=$(helm push chart/corsarr-*.tgz "oci://ghcr.io/$owner/charts" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "name=ghcr.io/$owner/charts/corsarr" >> "$GITHUB_OUTPUT"
          echo "digest=$(echo "$out" | sed -n 's/^Digest: //p')" >> "$GITHUB_OUTPUT"
      # The attestation is pushed next to the chart, which needs registry credentials
      # in the Docker config (helm's own login is not visible to it).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [image, files, plugins]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the changelog for the notes; the index tool and the trusted keys to sign with
          sparse-checkout: |
            CHANGELOG.md
            go.mod
            go.sum
            internal/
            scripts/pluginindex/
            sdk/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true
      - name: Sign the plugin index
        env:
          KEY: ${{ secrets.PLUGIN_INDEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "::warning::PLUGIN_INDEX_SIGNING_KEY is not set: the plugin index is published unsigned and corsarr will refuse it"
            exit 0
          fi
          go build -mod=readonly -o "$RUNNER_TEMP/pluginindex" ./scripts/pluginindex
          umask 077
          key="$RUNNER_TEMP/index-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" > "$key"
          "$RUNNER_TEMP/pluginindex" sign -key "$key" -o build/archives/plugins-index.json.sig build/archives/plugins-index.json
          # corsarr trusts only the keys compiled in from internal/catalogue/trusted; an index
          # signed with any other key would be refused, so the release stops here instead
          pubs=(internal/catalogue/trusted/*.pub)
          [ -e "${pubs[0]}" ] || { echo "::error::no trusted key in internal/catalogue/trusted: commit the public key of PLUGIN_INDEX_SIGNING_KEY"; exit 1; }
          args=(); for p in "${pubs[@]}"; do args+=(-pub "$p"); done
          "$RUNNER_TEMP/pluginindex" verify "${args[@]}" build/archives/plugins-index.json build/archives/plugins-index.json.sig
      - name: GitHub release with checksums, SBOMs and the builder identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          buildkit=$(sed -n 's/^BUILDKIT=//p' build/build.env)
          {
            # This release's section of CHANGELOG.md, without its heading.
            awk -v h="## ${GITHUB_REF_NAME} " 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md | sed '/./,$!d'
            echo
            echo "## Verify this release"
            echo
            echo "Rebuilt twice on independent runners (amd64 and arm64) with identical results."
            echo
            echo "- Image: \`$repo@$IMAGE_DIGEST\`"
            echo "- Builder: \`$buildkit\`; base images are pinned by digest in the tagged Dockerfile"
            echo "- Source date (SOURCE_DATE_EPOCH): \`$(sed -n 's/^SOURCE_DATE_EPOCH=//p' build/build.env)\`"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify corsarr-linux-amd64.tar.gz --repo $GITHUB_REPOSITORY"
            module=$(basename "$(find build/archives -maxdepth 1 -name '*.wasm' | sort | head -1)")
            echo "gh attestation verify $module --repo $GITHUB_REPOSITORY   # any plugin module"
            echo "cosign verify $repo@$IMAGE_DIGEST --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "just verify release $GITHUB_REF_NAME   # rebuild from source and compare"
            echo '```'
            echo
            echo "Details: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/VERIFYING.md"
            echo
          } > notes.md
          cd build/archives
          sig=(); [ -f plugins-index.json.sig ] && sig=(plugins-index.json.sig)
          gh release create "$GITHUB_REF_NAME" corsarr[-_]* ./*.wasm plugins-index.json ${sig[@]+"${sig[@]}"} SHA256SUMS ../../sbom/*.spdx.json \
            --repo "$GITHUB_REPOSITORY" --title "corsarr $GITHUB_REF_NAME" \
            --notes-file ../../notes.md --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
