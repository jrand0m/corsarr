name: release

# A version tag (v1.2.3) on master builds the release twice, on an amd64 and an
# arm64 runner, inside the pinned builder (Dockerfile + scripts/release.sh).
# The release fails unless both builds are byte-for-byte identical. Then the
# first build is published: six archives with SHA256SUMS, an SBOM and a
# build-provenance attestation per archive, and the multi-arch image with a
# keyless cosign signature, provenance and SBOM attestations (release tags also
# move :latest and :stable). Build jobs have no secrets and read-only access;
# publishing uses short-lived OIDC credentials. VERIFYING.md explains how
# to check any of it.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must point at a commit on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag and its commit time are build inputs
          persist-credentials: false
      - name: Build archives and image in the pinned builder
        env:
          NO_CACHE: all
        run: scripts/release.sh build "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.runner }}
          path: ${{ runner.temp }}/build
          retention-days: 3

  compare:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: builds
      - name: Both builds must be identical
        run: |
          set -euo pipefail
          diff builds/build-ubuntu-24.04/build.env builds/build-ubuntu-24.04-arm/build.env
          go run ./scripts/repro compare builds/build-ubuntu-24.04 builds/build-ubuntu-24.04-arm

  image:
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: build
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push the verified image without rebuilding it
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest=$(sed -n 's/^IMAGE_DIGEST=//p' build/build.env)
          tags=("$GITHUB_REF_NAME")
          # release tags (no "-rc.N" suffix) are stable; prereleases only get their own tag
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(latest stable)
          for t in "${tags[@]}"; do
            for i in 1 2 3; do
              skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
                oci:build/image "docker://$repo:$t" && break
              sleep $((i * 10))
            done
          done
          pushed="sha256:$(skopeo inspect --raw --authfile "$HOME/.docker/config.json" "docker://$repo:$GITHUB_REF_NAME" | sha256sum | cut -d' ' -f1)"
          [ "$pushed" = "$digest" ] || { echo "registry digest $pushed differs from the built $digest"; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Keyless signature
        run: cosign sign --yes "${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        id: syft
      - name: SBOM per platform
        run: |
          set -euo pipefail
          for p in amd64 arm64; do
            "${{ steps.syft.outputs.cmd }}" scan "registry:${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}" \
              --platform "linux/$p" -o "spdx-json=corsarr-image-linux-$p.spdx.json"
          done
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: corsarr-image-linux-amd64.spdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: corsarr-image-linux-arm64.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: corsarr-image-*.spdx.json
          retention-days: 3

  archives:
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        archive:
          - corsarr-linux-amd64.tar.gz
          - corsarr-linux-arm64.tar.gz
          - corsarr-darwin-amd64.tar.gz
          - corsarr-darwin-arm64.tar.gz
          - corsarr-windows-amd64.zip
          - corsarr-windows-arm64.zip
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: build
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        id: syft
      - name: SBOM for ${{ matrix.archive }}
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="${ARCHIVE%.tar.gz}"; name="${name%.zip}"
          mkdir x
          case "$ARCHIVE" in *.zip) unzip -q "build/archives/$ARCHIVE" -d x ;; *) tar -xzf "build/archives/$ARCHIVE" -C x ;; esac
          "${{ steps.syft.outputs.cmd }}" scan "dir:x/$name" --source-name corsarr --source-version "$GITHUB_REF_NAME" \
            -o "spdx-json=$name.spdx.json"
          echo "SBOM=$name.spdx.json" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/archives/${{ matrix.archive }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: build/archives/${{ matrix.archive }}
          sbom-path: ${{ env.SBOM }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.archive }}
          path: ${{ env.SBOM }}
          retention-days: 3

  publish:
    needs: [image, archives]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true
      - name: GitHub release with checksums, SBOMs and the builder identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          buildkit=$(sed -n 's/^BUILDKIT=//p' build/build.env)
          {
            echo "## Verify this release"
            echo
            echo "Rebuilt twice on independent runners (amd64 and arm64) with identical results."
            echo
            echo "- Image: \`$repo@$IMAGE_DIGEST\`"
            echo "- Builder: \`$buildkit\`; base images are pinned by digest in the tagged Dockerfile"
            echo "- Source date (SOURCE_DATE_EPOCH): \`$(sed -n 's/^SOURCE_DATE_EPOCH=//p' build/build.env)\`"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify corsarr-linux-amd64.tar.gz --repo $GITHUB_REPOSITORY"
            echo "cosign verify $repo@$IMAGE_DIGEST --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "just verify release $GITHUB_REF_NAME   # rebuild from source and compare"
            echo '```'
            echo
            echo "Details: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/VERIFYING.md"
            echo
          } > notes.md
          cd build/archives
          gh release create "$GITHUB_REF_NAME" corsarr-* SHA256SUMS ../../sbom/*.spdx.json \
            --repo "$GITHUB_REPOSITORY" --title "corsarr $GITHUB_REF_NAME" \
            --notes-file ../../notes.md --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
