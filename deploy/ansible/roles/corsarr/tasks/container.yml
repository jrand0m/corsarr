---
- name: Create the config directory
  ansible.builtin.file:
    path: /etc/corsarr
    state: directory
    owner: root
    group: "{{ corsarr_container_user.split(':')[1] }}"
    mode: "0750"

- name: Write the environment file for ${env:NAME} references
  ansible.builtin.template:
    src: corsarr.env.j2
    dest: /etc/corsarr/corsarr.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: corsarr_envfile

- name: Write corsarr.yml
  ansible.builtin.template:
    src: corsarr.yml.j2
    dest: /etc/corsarr/corsarr.yml
    owner: root
    group: "{{ corsarr_container_user.split(':')[1] }}"
    mode: "0640"
  vars:
    corsarr_data_dir: /data
    corsarr_listen_port: 8090
  # a restart mounts the replaced file; corsarr reads it at start
  notify: Restart the corsarr container

- name: Run the corsarr container
  community.docker.docker_container:
    name: "{{ corsarr_container_name }}"
    image: "{{ corsarr_image }}"
    pull: missing
    restart_policy: unless-stopped
    user: "{{ corsarr_container_user }}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opts: ["no-new-privileges:true"]
    command: ["--configFile=/etc/corsarr/corsarr.yml"]
    env:
      GOMEMLIMIT: 96MiB
    env_file: /etc/corsarr/corsarr.env
    published_ports:
      - "{{ corsarr_port }}:8090"
    volumes:
      - /etc/corsarr/corsarr.yml:/etc/corsarr/corsarr.yml:ro
      - "{{ corsarr_container_volume }}:/data"
      - "{{ corsarr_media_dir }}:/media{{ (corsarr_media_readonly | bool) | ternary(':ro', '') }}"
    healthcheck:
      test: ["CMD", "/corsarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    memory: 256m
    pids_limit: 256
    # the environment file is only read when the container is created
    recreate: "{{ corsarr_envfile is changed }}"
    state: started
