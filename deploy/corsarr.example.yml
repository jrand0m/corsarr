# corsarr configuration with every default, generated by `corsarr config defaults --format=yaml`.
# Loading it as is gives the same settings as starting with no configuration at all.
# Lines starting with "#" are settings without a default and sections where you add your own
# entries (indexers, download clients, …); remove the "#" and fill them in to use them.
# Keys in angle brackets are placeholders: <name> is a name you choose, made of lower-case
# letters and digits. Secrets are best given as ${env:NAME} or ${file:/run/secrets/name}.
# Every setting is explained in docs/configuration.md and by `corsarr config defaults`.

# Format version of the configuration; leave it at 1.
version: 1

# Web server (applies at start).
server:
  # Address and port the web UI and API listen on; change the port when 8090 is taken, or add a
  # host to listen on one network interface only.
  address: :8090
  # Path prefix when a reverse proxy serves corsarr under a sub-path, for example /corsarr;
  # leave empty when it has its own host name.
  # basePath:
  # Hosts corsarr may contact (exact name, *.domain or an IP range); leave empty to allow every
  # host, or list hosts to lock outgoing traffic down.
  # egressAllow:
  #   -
  # How corsarr finds each service's rate limit and stays below it.
  rateLearning:
    # Learn where each service starts throttling and keep requests below it; turn off to use only
    # the configured limits. true or false.
    enabled: true
    # Share of a learned limit corsarr uses, between 0.1 and 1; lower it to stay further from the
    # limit.
    headroom: 0.85
    # How often a limit found by throttling is gently re-checked while requests are waiting; 0
    # never re-checks. A duration such as 90s, 15m or 2h.
    probeEvery: 168h0m0s

# Data folder (applies at start).
data:
  # Folder for the database, the secret key, backups and logs; point it at storage that survives
  # restarts and upgrades.
  dir: /data
  # Permission mask for every file corsarr creates, in octal; 002 lets a shared media group
  # write, 022 keeps files writable by corsarr only.
  umask: "002"

# Artwork cache: posters and covers are fetched once, stored and served by corsarr (applies at
# start).
cache:
  # Keep fetched artwork on disk; turn off to fetch artwork from the provider on every view.
  # true or false.
  enabled: true
  # Folder for cached artwork; leave empty to use the cache folder inside the data folder.
  # dir:
  # Most disk space the cache may use, with a unit such as 500MiB or 2GiB.
  maxSize: 1GiB
  # How artwork is stored.
  images:
    # JPEG quality of stored artwork, from 30 to 95; lower saves space, higher looks sharper.
    quality: 82
    # Widest a stored poster or cover may be, in pixels, from 100 to 2000.
    maxWidth: 600
    # Widest a stored backdrop may be, in pixels, from 100 to 4000.
    backdropMaxWidth: 1280
    # How artwork shrinks when the cache nears its size cap: lower quality first, then smaller
    # sizes, then the least recently viewed is removed.
    degrade:
      # Lowest JPEG quality artwork is reduced to before it is made smaller.
      qualityFloor: 60
      # How much the JPEG quality drops in each reduction step.
      qualityStep: 10
      # Narrowest a poster or cover is made, in pixels, before it is removed instead.
      widthFloor: 300
      # Share of its width artwork keeps in each size reduction step, between 0.5 and 0.95.
      widthStep: 0.75
      # Share of the size cap at which shrinking starts, between 0.5 and 1.
      highWater: 0.9
      # Share of the size cap at which shrinking stops, between 0.3 and 0.95; keep it below
      # highWater.
      lowWater: 0.8

# Logging (applies at start).
log:
  # How much is logged; use debug while tracking down a problem, warn or error to keep logs
  # short. One of: debug, info, warn, error.
  level: info

# Sign-in (applies at start).
auth:
  # How people sign in: password asks for the admin login or the API key, local lets devices on
  # private networks in without one, proxy trusts the user name your reverse proxy sends. One
  # of: password, local, proxy.
  mode: password

# Plugin modules: WebAssembly plugins installed into the plugins folder (applies at start).
plugins:
  # Folder for plugin modules; leave empty for the plugins folder inside data.dir. Drop a .wasm
  # file here to install it.
  # dir:
  # Built-in plugin ids to switch off, so a plugin module with the same id can replace them;
  # leave empty to keep every built-in.
  # disabledBuiltins:
  #   -
  # Most memory one running module instance may use, in MiB; a module may ask for less, never
  # more.
  memoryMiB: 64
  # Longest one call into a module may run before it is stopped; a module may ask for less,
  # never more. A duration such as 90s, 15m or 2h.
  callTimeout: 10s
  # Most calls one plugin instance runs at the same time; each runs in its own module instance.
  concurrency: 4
  # Largest module file accepted, in MiB.
  maxModuleMiB: 32
  # Allow installing, updating, rolling back and removing plugin modules from the web UI and the
  # API; set false to manage modules only through this config and the plugins folder. true or
  # false.
  uiInstall: true
  # Where plugin modules are offered.
  # catalogue:
  #   # Address of the signed plugin index; leave empty for the official index of this release. With
  #   # server.egressAllow set, allow this host and the host its downloads redirect to.
  #   url:
  # Plugin modules to install from the catalogue when corsarr starts; leave empty to install
  # nothing this way.
  # install:
  #   -
  #     # Id of the plugin in the catalogue, for example transmission.
  #     id:
  #     # Version to install, for example 1.2.0; leave empty for the version the catalogue offers.
  #     version:
  # Install newer catalogue versions of installed modules once a day: patch takes 1.2.x updates,
  # minor takes 1.x updates, off never updates on its own. Versions that ask for new permissions
  # always wait for you. One of: off, patch, minor.
  autoUpdate: "off"

# What corsarr does for each kind of media.
mediaKinds:
  tv:
    # How corsarr handles TV series: disabled turns it off, shadow decides everything but only
    # records what it would grab, active grabs and imports. One of: disabled, shadow, active.
    mode: active
  movie:
    # How corsarr handles movies: disabled turns it off, shadow decides everything but only
    # records what it would grab, active grabs and imports. One of: disabled, shadow, active.
    mode: active
  music:
    # How corsarr handles music: disabled turns it off, shadow decides everything but only records
    # what it would grab, active grabs and imports. One of: disabled, shadow, active.
    mode: active
  book:
    # How corsarr handles books: disabled turns it off, shadow decides everything but only records
    # what it would grab, active grabs and imports. One of: disabled, shadow, active.
    mode: disabled

# Library root folders.
# rootFolders:
#   -
#     # Full path of a library folder as corsarr sees it, for example /media/movies.
#     path:
#     # Which kind of media lives in this folder. One of: tv, movie, music, book.
#     kind:

# Custom formats, one entry per key you choose (lower-case letters and digits); profiles score
# them.
# customFormats:
#   <name>:
#     # Name shown in the web UI and in decision reasons.
#     name:
#     # The tests a release must pass; conditions of one kind need one hit, conditions marked
#     # required must all hold.
#     conditions:
#       -
#         # What the condition looks at: title, group or edition (a pattern); source, resolution,
#         # modifier, codec, audio, channels, hdr, language, flag, releasetype, container, bitdepth or
#         # dvfallback (values); size in GB or year (min and max). One of: title, group, edition,
#         # source, resolution, modifier, codec, audio, channels, hdr, language, flag, size,
#         # releasetype, year, container, bitdepth, dvfallback.
#         kind:
#         # Regular expression for title, group and edition conditions, matched without regard to case,
#         # for example \bDTS\b.
#         pattern:
#         # Values for list conditions; the condition holds when the release has any of them, for
#         # example [aac, ac3, eac3].
#         values:
#           -
#         # Lower bound of a size (GB, exclusive) or year (inclusive) condition.
#         min:
#         # Upper bound of a size (GB) or year condition; 0 means no upper bound.
#         max:
#         # Turn the condition around: it holds when the test fails. true or false.
#         negate: false
#         # The format matches only when this condition holds; otherwise one condition of the same kind
#         # is enough. true or false.
#         required: false
#         # Language conditions only: hold when the release has a language other than the listed ones.
#         # true or false.
#         except: false

# Custom quality profiles, one entry per key you choose (not a built-in key such as hd1080p);
# series, movies and artists name them by key.
# qualityProfiles:
#   <name>:
#     # Name shown in the web UI.
#     # name:
#     # What the profile is for: tv, movie, both, or music on its own.
#     # kinds:
#     #   # One of: tv, movie, music.
#     #   -
#     # Allowed qualities from worst to best; qualities in one group count the same.
#     # groups:
#     #   -
#     #     # Name of a group of several qualities, for example WEB 1080p.
#     #     name:
#     #     # Quality ids in this group, for example [webdl-1080p, webrip-1080p].
#     #     qualities:
#     #       # One of: unknown, cam, telesync, telecine, screener, dvd, sdtv, webrip-480p, webdl-480p,
#     #       # bluray-480p, bluray-576p, hdtv-720p, webrip-720p, webdl-720p, bluray-720p, hdtv-1080p,
#     #       # webrip-1080p, webdl-1080p, bluray-1080p, remux-1080p, disc-1080p, hdtv-2160p, webrip-2160p,
#     #       # webdl-2160p, bluray-2160p, remux-2160p, disc-2160p, audio-unknown, mp3-low, mp3-96, mp3-128,
#     #       # mp3-160, wma, mp3-192, aac-192, vorbis, mp3-vbr-v2, mp3-224, mp3-256, aac-256, aac-vbr,
#     #       # opus, mp3-vbr-v0, mp3-320, aac-320, wav, ape, wavpack, alac, flac, alac-24, flac-24.
#     #       -
#     # Upgrades stop once a file has this quality (or one ranked the same or higher). One of:
#     # unknown, cam, telesync, telecine, screener, dvd, sdtv, webrip-480p, webdl-480p, bluray-480p,
#     # bluray-576p, hdtv-720p, webrip-720p, webdl-720p, bluray-720p, hdtv-1080p, webrip-1080p,
#     # webdl-1080p, bluray-1080p, remux-1080p, disc-1080p, hdtv-2160p, webrip-2160p, webdl-2160p,
#     # bluray-2160p, remux-2160p, disc-2160p, audio-unknown, mp3-low, mp3-96, mp3-128, mp3-160,
#     # wma, mp3-192, aac-192, vorbis, mp3-vbr-v2, mp3-224, mp3-256, aac-256, aac-vbr, opus,
#     # mp3-vbr-v0, mp3-320, aac-320, wav, ape, wavpack, alac, flac, alac-24, flac-24.
#     # cutoff:
#     # Replace files with better releases until the cutoff and the cutoff format score are met.
#     # true or false.
#     upgrades: true
#     # Scores for custom formats; a release scores the sum of the formats it matches.
#     # formats:
#     #   -
#     #     # Key of a custom format.
#     #     format:
#     #     # Points a match adds (negative to penalise).
#     #     score: 0
#     #     # Reject every release matching this format, whatever the scores. true or false.
#     #     reject: false
#     # Releases scoring below this are rejected.
#     minFormatScore: 0
#     # Upgrades continue until a file scores at least this (and has the cutoff quality).
#     cutoffFormatScore: 0
#     # Smallest score gain that counts as an upgrade at the same quality.
#     minUpgradeFormatScore: 1
#     # Size limits of this profile for some qualities, in MB per minute of runtime; other qualities
#     # use the global limits.
#     # sizes:
#     #   -
#     #     # An allowed quality id. One of: unknown, cam, telesync, telecine, screener, dvd, sdtv,
#     #     # webrip-480p, webdl-480p, bluray-480p, bluray-576p, hdtv-720p, webrip-720p, webdl-720p,
#     #     # bluray-720p, hdtv-1080p, webrip-1080p, webdl-1080p, bluray-1080p, remux-1080p, disc-1080p,
#     #     # hdtv-2160p, webrip-2160p, webdl-2160p, bluray-2160p, remux-2160p, disc-2160p, audio-unknown,
#     #     # mp3-low, mp3-96, mp3-128, mp3-160, wma, mp3-192, aac-192, vorbis, mp3-vbr-v2, mp3-224,
#     #     # mp3-256, aac-256, aac-vbr, opus, mp3-vbr-v0, mp3-320, aac-320, wav, ape, wavpack, alac,
#     #     # flac, alac-24, flac-24.
#     #     quality:
#     #     # Smallest size in MB per minute.
#     #     min:
#     #     # Size aimed for in MB per minute; 0 uses the global preferred size.
#     #     preferred:
#     #     # Largest size in MB per minute; must be above min.
#     #     max:
#     # Allow full disc images (ISO, BDMV). true or false.
#     allowDiscImage: false
#     # Allow 3D releases. true or false.
#     allow3D: false

# Folder and file names per kind of media; tokens in braces, e.g. {Movie Title}{ (Release
# Year)}, with text inside the braces written only when the token has a value.
naming:
  # How TV series folders and files are named.
  tv:
    # Rename imported files with the file template; false keeps each file's own name inside the
    # item's folder. true or false.
    rename: true
    # What replaces a colon in names: delete drops it, dash writes -, spaceDash writes " - ",
    # smart writes " - " after a word and drops it between digits. One of: delete, dash,
    # spaceDash, smart.
    colon: smart
    # Folder of a series added from now on, inside its root folder.
    seriesFolder: '{Series Title}{ (Release Year)}'
    # Season folder inside the series folder (series that use season folders).
    seasonFolder: Season {Season}
    # Name of an imported episode file, without the extension.
    episodeFile: '{Series Title} - S{Season}E{Episode}{ - Episode Title}{ [Quality Full]}'
  # How movies folders and files are named.
  movie:
    # Rename imported files with the file template; false keeps each file's own name inside the
    # item's folder. true or false.
    rename: true
    # What replaces a colon in names: delete drops it, dash writes -, spaceDash writes " - ",
    # smart writes " - " after a word and drops it between digits. One of: delete, dash,
    # spaceDash, smart.
    colon: smart
    # Folder of a movie added from now on, inside its root folder.
    movieFolder: '{Movie Title}{ (Release Year)}'
    # Name of an imported movie file, without the extension.
    movieFile: '{Movie Title}{ (Release Year)}{ - Edition}{ [Quality Full]}{ - Release Group}'
  # How music folders and files are named.
  music:
    # Rename imported files with the file template; false keeps each file's own name inside the
    # item's folder. true or false.
    rename: true
    # What replaces a colon in names: delete drops it, dash writes -, spaceDash writes " - ",
    # smart writes " - " after a word and drops it between digits. One of: delete, dash,
    # spaceDash, smart.
    colon: smart
    # Folder of an artist added from now on, inside its root folder.
    artistFolder: '{Artist Name}'
    # Album folder inside the artist folder.
    albumFolder: '{Album Title}{ (Release Year)}'
    # Name of an imported track file, without the extension.
    trackFile: '{Artist Name} - {Album Title} - {Track} - {Track Title}'

# Automatic clean-up and upgrade rules.
# automation:
#   # One entry per rule, keyed by rule id (upgradereplace, itemdelete, recyclepurge, …).
#   rules:
#     <name>:
#       # off never runs the rule, dry-run only records what it would do, live acts; leave unset to
#       # keep the rule's own default. Try dry-run first. One of: off, dry-run, live.
#       mode:

# Compatibility API for third-party tools (request managers, dashboards) under /legacy/<app>;
# each app is off until enabled.
legacy:
  # Sonarr-compatible API at /legacy/sonarr/api/v3 (TV).
  sonarr:
    # Turn on to let request managers and dashboards use this API; they sign in with the corsarr
    # API key. true or false.
    enabled: false
  # Radarr-compatible API at /legacy/radarr/api/v3 (movies).
  radarr:
    # Turn on to let request managers and dashboards use this API; they sign in with the corsarr
    # API key. true or false.
    enabled: false
  # Lidarr-compatible read-only API at /legacy/lidarr/api/v1 (music).
  lidarr:
    # Turn on to let request managers and dashboards use this API; they sign in with the corsarr
    # API key. true or false.
    enabled: false
  # Prowlarr-compatible read-only API at /legacy/prowlarr/api/v1 (indexers).
  prowlarr:
    # Turn on to let request managers and dashboards use this API; they sign in with the corsarr
    # API key. true or false.
    enabled: false

# Model Context Protocol endpoint at <base>/mcp for AI assistants; off until enabled.
mcp:
  # Serve the MCP endpoint (authenticated with the corsarr API key or the read-only key). true
  # or false.
  enabled: false
  # read: only tools that change nothing; write: also tools that add, search, monitor or remove.
  # One of: read, write.
  scope: read
  # Tool names to expose; empty exposes every tool the scope allows.
  # tools:
  #   -
  # Most MCP calls per minute per API key; 0 means no limit.
  rateLimit: 60
  # Browser origins allowed besides the server's own, e.g. http://localhost:6274; clients that
  # send no Origin are always allowed.
  # allowedOrigins:
  #   -

# Your indexer connections, one entry per name you choose (lower-case letters and digits).
# indexers:
#   <name>:
#     # Which plugin this entry uses; its own settings are listed per plugin. One of: knaben,
#     # thepiratebay, torznab.
#     type:
#     # Name shown in the web UI.
#     name:
#     # Set to false to keep the entry but stop using it. true or false.
#     enabled: true
#     # Most searches sent to this indexer per queryLimitPer, for sites that limit API use; 0 means
#     # no limit. Past the limit the indexer is skipped until the window frees up.
#     queryLimit: 0
#     # Whether queryLimit counts per hour or per day. One of: hour, day.
#     queryLimitPer: day
#
#     # ── with type: knaben (Knaben) ──
#     # Address of the site. Change it only when the site moves.
#     baseUrl: https://api.knaben.org/
#     # Leave out results the service marks as unsafe. true or false.
#     hideUnsafe: true
#     # Lower numbers win when the same release is found on several indexers (1 to 50).
#     priority: 25
#
#     # ── with type: thepiratebay (The Pirate Bay) ──
#     # Address of the site. Change it only when the site moves.
#     baseUrl: https://apibay.org/
#     # Lower numbers win when the same release is found on several indexers (1 to 50).
#     priority: 25
#
#     # ── with type: torznab (Torznab) ──
#     # Base address of the Torznab indexer, for example
#     # http://jackett:9117/api/v2.0/indexers/all/results/torznab.
#     url:
#     # Path appended to the address. Leave as /api unless the indexer documents another path; use
#     # an empty value when the address already ends in the API endpoint.
#     apiPath: /api
#     # API key issued by the indexer. Public indexers may not need one. Give the value, ${env:NAME}
#     # or ${file:/path}.
#     apiKey:
#     # Torznab category ids to search for each media kind (movie, tv, music, book). Defaults use
#     # the standard parents 2000, 5000, 3000 and 7000.
#     categories:
#       book:
#         - 7000
#       movie:
#         - 2000
#       music:
#         - 3000
#       tv:
#         - 5000
#     # Lower numbers win when the same release is found on several indexers (1 to 50).
#     priority: 25

# Your download client connections, one entry per name you choose (lower-case letters and
# digits).
# downloadClients:
#   <name>:
#     # Which plugin this entry uses; its own settings are listed per plugin. One of: qbittorrent,
#     # sabnzbd.
#     type:
#     # Name shown in the web UI.
#     name:
#     # Set to false to keep the entry but stop using it. true or false.
#     enabled: true
#
#     # ── with type: qbittorrent (qBittorrent) ──
#     # Address of the qBittorrent Web UI, for example http://qbittorrent:8080. A reverse-proxy
#     # sub-path is allowed.
#     url:
#     # Web UI user name. Leave empty when authentication is bypassed for this host.
#     username:
#     # Web UI password. Give the value, ${env:NAME} or ${file:/path}.
#     password:
#     # qBittorrent category used for each media kind (movie, tv, music, book). Imports only look at
#     # these categories.
#     categories:
#       book: books
#       movie: movies
#       music: music
#       tv: tv
#     # Needed when qBittorrent sees its download folders under other paths than corsarr (another
#     # host, or containers with different mounts). One remote=local entry per folder, for example
#     # /downloads=/mnt/media/downloads. The longest matching prefix wins.
#     pathMap:
#       -
#
#     # ── with type: sabnzbd (SABnzbd-compatible) ──
#     # Address of the SABnzbd web interface, for example http://sabnzbd:8080. A reverse-proxy
#     # sub-path is allowed.
#     url:
#     # The full API key from the SABnzbd general settings (not the NZB key). Give the value,
#     # ${env:NAME} or ${file:/path}.
#     apiKey:
#     # SABnzbd category used for each media kind (movie, tv, music, book). A missing category is
#     # created in SABnzbd.
#     categories:
#       book: books
#       movie: movies
#       music: music
#       tv: tv
#     # Needed when SABnzbd sees its folders under other paths than corsarr. One remote=local entry
#     # per folder, for example /downloads=/mnt/media/downloads. The longest matching prefix wins.
#     pathMap:
#       -

# Your metadata connections, one entry per name you choose (lower-case letters and digits).
# metadata:
#   <name>:
#     # Which plugin this entry uses; its own settings are listed per plugin. One of: musicbrainz,
#     # tmdb.
#     type:
#     # Name shown in the web UI.
#     name:
#     # Set to false to keep the entry but stop using it. true or false.
#     enabled: true
#
#     # ── with type: musicbrainz (MusicBrainz) ──
#     # Change this only to use a MusicBrainz mirror; a mirror may allow a higher request rate.
#     baseUrl: https://musicbrainz.org/ws/2
#     # An address or URL sent with every request, as MusicBrainz asks of applications.
#     contact: https://github.com/jrand0m/corsarr
#     # The public service allows one request per second; higher values only apply to a mirror.
#     requestsPerSecond: 1
#
#     # ── with type: tmdb (TMDB) ──
#     # TMDB v3 API key, or the v4 read access token (a long value starting with eyJ). Both come
#     # from your TMDB account's API settings. Give the value, ${env:NAME} or ${file:/path}.
#     apiKey:
#     # Language of titles and overviews as an IETF tag, for example en-US or de-DE.
#     language: en-US
#     # Two-letter country code (for example US) whose cinema, digital and physical release dates
#     # are used. Empty uses the earliest date worldwide.
#     region:
#     # Only change this to reach TMDB through a mirror or proxy.
#     baseUrl: https://api.themoviedb.org/3

# Your media server connections, one entry per name you choose (lower-case letters and
# digits).
# mediaServers:
#   <name>:
#     # Which plugin this entry uses; its own settings are listed per plugin. One of: plex.
#     type:
#     # Name shown in the web UI.
#     name:
#     # Set to false to keep the entry but stop using it. true or false.
#     enabled: true
#
#     # ── with type: plex (Plex) ──
#     # Address of your Plex server, for example http://plex:32400. It stays exactly as typed;
#     # corsarr never replaces it with an address Plex advertises.
#     url:
#     # Plex authentication token. Paste one, or use Sign in with Plex when that flow is available.
#     # Give the value, ${env:NAME} or ${file:/path}.
#     token:
#     # Machine identifier of the paired server. When set, tests fail if another server answers at
#     # this address.
#     machineId:
#     # Maps path prefixes as corsarr sees them to the same folders as Plex sees them, for example
#     # /data/movies to /media/movies. Needed only when the two differ.
#     sectionMap:
#       <name>:

# Your notification connections, one entry per name you choose (lower-case letters and
# digits).
# notifications:
#   <name>:
#     # Which plugin this entry uses; its own settings are listed per plugin. One of: native,
#     # shoutrrr.
#     type:
#     # Name shown in the web UI.
#     name:
#     # Set to false to keep the entry but stop using it. true or false.
#     enabled: true
#     # Message template of this connection (Go text/template); .Title and .Body hold the built-in
#     # text, plus .Event, .Items, .Grab, .Import, .Download, .Payload.
#     template:
#       # Message title as a template, for example [corsarr] {{.Title}}; leave empty for the built-in
#       # title.
#       title:
#       # Message text as a template; leave empty for the built-in text.
#       body:
#     # Which events send a message; leave empty for grab, import, upgrade, downloadFailed,
#     # importFailed and manualAction.
#     on:
#       # One of: grab, import, upgrade, rename, delete, itemAdded, itemDeleted, downloadFailed,
#       # importFailed, manualAction, health, automation, config.
#       -
#
#     # ── with type: native (Built-in notifications) ──
#     # One service URL per entry. URLs usually contain keys or tokens, so they are stored as
#     # secrets and shown masked.
#     urls:
#       -
#
#     # ── with type: shoutrrr (Notification services (shoutrrr)) ──
#     # One service URL per entry. URLs usually contain keys or tokens, so they are stored as
#     # secrets and shown masked.
#     urls:
#       -

# Your source connections, one entry per name you choose (lower-case letters and digits).
# sources:
#   <name>:
#     # Which plugin this entry uses; its own settings are listed per plugin. One of:
#     # mechanicalwavescloud, trubadurcamp.
#     type:
#     # Name shown in the web UI.
#     name:
#     # Set to false to keep the entry but stop using it. true or false.
#     enabled: true
#
#     # ── with type: mechanicalwavescloud (MechanicalWavesCloud) ──
#     # Address of the MechanicalWavesCloud source service corsarr searches and downloads through.
#     baseUrl:
#     # An access token of your MechanicalWavesCloud account; it unlocks liked and private uploads.
#     # Give the value, ${env:NAME} or ${file:/path}.
#     token:
#     # original keeps the uploaded file where the uploader allows it; mp3 takes the streaming copy.
#     # One of: original, mp3.
#     format: original
#     # Where fetched audio is written before import; on the same file system as the music library
#     # it is hardlinked.
#     downloadDir:
#
#     # ── with type: trubadurcamp (TrubadurCamp) ──
#     # Address of the TrubadurCamp source service corsarr searches and downloads through.
#     baseUrl:
#     # The session cookie of your TrubadurCamp account; it unlocks the albums in your collection.
#     # Give the value, ${env:NAME} or ${file:/path}.
#     identity:
#     # The format albums are downloaded in; FLAC keeps the original quality. One of: flac, mp3-320,
#     # mp3-v0, alac, aac-hi, vorbis, wav.
#     format: flac
#     # Where fetched albums are written before import; on the same file system as the music library
#     # they are hardlinked.
#     downloadDir:
