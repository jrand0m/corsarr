# corsarr on umbrelOS: the NAS compose sample (../../../nas/compose.yml) behind Umbrel's
# app proxy. Umbrel's own login protects the UI in addition to corsarr's.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: jrand0m-corsarr_server_1
      APP_PORT: 8090

  server:
    image: ghcr.io/jrand0m/corsarr:v0.4.0
    user: "1000:1000"
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GOMEMLIMIT: 96MiB
    volumes:
      - ${APP_DATA_DIR}/data:/data                         # database and keys
      - ${UMBREL_ROOT}/data/storage/downloads:/media      # downloads + library, one filesystem
    healthcheck:
      test: ["CMD", "/corsarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 256m
