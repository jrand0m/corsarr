# corsarr configuration for native installs (/etc/corsarr/corsarr.yml).
# Generated from `corsarr config defaults --format=yaml`, with data.dir set to the systemd
# state directory. A config file is the only source when present: CORSARR_* variables are
# then ignored, so secrets go in as references, ${file:/run/credentials/corsarr.service/name}
# (systemd LoadCredential=) or ${env:NAME}, never as values.
# See deploy/corsarr.example.yml for indexers, download clients and the rest.
version: 1
server:
  address: ":8090"
data:
  dir: /var/lib/corsarr
log:
  level: info
auth:
  mode: password
plugins:
  # Plugin modules come from plugins.install below or the plugins folder; the web UI only
  # browses the catalogue.
  uiInstall: false
mediaKinds:
  tv: { mode: active }
  movie: { mode: active }
  music: { mode: active }
  book: { mode: disabled }
