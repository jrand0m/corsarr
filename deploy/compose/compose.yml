# corsarr with Docker Compose, using a download client you already run.
#   cp .env.example .env                       # media path and API keys
#   echo 'qbittorrent-password' > secrets/qbit_password.txt
#   docker compose up -d                       # then open http://localhost:8090
# Set the qBittorrent address in corsarr.yml. To run qBittorrent here too, use
# compose.qbittorrent.yml instead.
#
# Downloads and the library must live on ONE filesystem, mounted at the SAME path the
# download client uses, so imports are hardlinks instead of copies.
name: corsarr
services:
  corsarr:
    image: ghcr.io/jrand0m/corsarr:v0.4.0   # pin a release; :latest follows releases
    restart: unless-stopped
    user: "65532:65532"                      # /data and the media dir must be writable by it
    read_only: true                          # only /data and /tmp are written
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--configFile=/etc/corsarr/corsarr.yml"]
    environment:
      GOMEMLIMIT: 96MiB                      # soft heap limit; keep below the memory limit
      # referenced from corsarr.yml as ${env:NAME}; values live in .env
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      INDEXER_API_KEY: ${INDEXER_API_KEY:?set INDEXER_API_KEY in .env}
    secrets: [qbit_password]                 # referenced as ${file:/run/secrets/qbit_password}
    ports:
      - "8090:8090"
    volumes:
      - ./corsarr.yml:/etc/corsarr/corsarr.yml:ro
      - corsarr-data:/data                   # database, keys, logs: back this up
      - ${MEDIA_DIR:-/srv/media}:/media      # downloads + library on one filesystem
      # Shadow mode (corsarr never writes media):
      # - ${MEDIA_DIR:-/srv/media}:/media:ro
    healthcheck:
      test: ["CMD", "/corsarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 256m
    pids_limit: 256

secrets:
  qbit_password:
    file: ./secrets/qbit_password.txt

volumes:
  corsarr-data: {}
