# corsarr configuration for compose.qbittorrent.yml.
# Generated from `corsarr config defaults --format=yaml`, plus the qBittorrent client.
# The password is a Docker secret, read through a reference, never written here.
version: 1
server:
  address: ":8090"
data:
  dir: /data
log:
  level: info
auth:
  mode: password
mediaKinds:
  tv: { mode: active }
  movie: { mode: active }
  music: { mode: active }
  book: { mode: disabled }
downloadClients:
  qbit:
    type: qbittorrent
    url: http://qbittorrent:8080
    username: admin
    password: ${file:/run/secrets/qbit_password}
