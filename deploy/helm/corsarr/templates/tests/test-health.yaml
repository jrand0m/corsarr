apiVersion: v1
kind: Pod
metadata:
  name: {{ include "corsarr.fullname" . }}-test-health
  labels:
    {{- include "corsarr.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "corsarr.image" . | quote }}
      # The image has no shell; its own healthcheck command probes the service.
      args: ["healthcheck", "--server.address={{ include "corsarr.fullname" . }}:{{ .Values.service.port }}"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        limits:
          memory: 64Mi
