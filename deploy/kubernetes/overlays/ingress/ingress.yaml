apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corsarr
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt
spec:
  # ingressClassName: nginx
  rules:
    - host: corsarr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: corsarr
                port:
                  name: http
