apiVersion: apps/v1
kind: Deployment
metadata:
  name: corsarr
spec:
  replicas: 1                     # one SQLite file: exactly one pod
  strategy:
    type: Recreate                # never two pods on the data volume
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: corsarr
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: corsarr
          image: ghcr.io/jrand0m/corsarr:v0.4.0
          args: ["--configFile=/etc/corsarr/corsarr.yml"]
          env:
            - name: GOMEMLIMIT
              value: 192MiB       # about 75% of the memory limit
          # Secrets: create them, then reference them from corsarr.yml as ${env:NAME}.
          #   kubectl -n corsarr create secret generic corsarr-secrets --from-literal=TMDB_API_KEY=…
          # envFrom:
          #   - secretRef:
          #       name: corsarr-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8090
          startupProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/corsarr
              readOnly: true
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: corsarr-config
        - name: data
          persistentVolumeClaim:
            claimName: corsarr-data
        - name: media
          persistentVolumeClaim:
            claimName: corsarr-media
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
