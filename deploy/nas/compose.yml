# corsarr for NAS container managers (Synology Container Manager, TrueNAS SCALE custom
# app, QNAP Container Station, UGREEN UGOS Docker). Self-contained: no .env, no config
# file; corsarr starts on its defaults and is configured in the web UI.
#
# Set the two paths and the user to your NAS's values (see README.md): edit the value after
# ":-", or set PUID, PGID, DATA_DIR, MEDIA_DIR and PORT where your NAS takes variables
# (Portainer's app template does).
services:
  corsarr:
    image: ghcr.io/jrand0m/corsarr:v0.4.0
    container_name: corsarr
    restart: unless-stopped
    # The NAS user that owns the media share (Synology: `id` over SSH, often 1026:100;
    # TrueNAS: apps 568:568; QNAP/UGOS: 1000:100). It must be able to write both paths below.
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GOMEMLIMIT: 96MiB
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - ${DATA_DIR:-/volume1/docker/corsarr}:/data   # database and key file: back this up
      - ${MEDIA_DIR:-/volume1/data/media}:/media     # downloads + library on one share
      # Shadow mode (corsarr never writes media):
      # - ${MEDIA_DIR:-/volume1/data/media}:/media:ro
    healthcheck:
      test: ["CMD", "/corsarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 256m
